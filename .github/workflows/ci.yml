name: UdaanSetu CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: udaan-setu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Offline cross-layer contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check API paths, career IDs, privacy boundary and phase files
        run: python scripts/check-integration-contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check curated resource catalogue and locale behavior without npm dependencies
        working-directory: frontend
        run: node scripts/check-resource-hub.mjs

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Component and utility tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Confirm built entrypoint exists
        run: test -s frontend/dist/index.html
      - name: Upload generated npm lockfile for repository pinning
        if: always() && hashFiles('frontend/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock-review
          path: frontend/package-lock.json
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Java 21 compile, tests and packaged JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Java project
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Confirm packaged artifact exists
        run: test -s backend/target/platform-api-0.7.1.jar
      - name: Upload packaged API
        uses: actions/upload-artifact@v4
        with:
          name: udaan-setu-platform-api
          path: backend/target/platform-api-0.7.1.jar
          if-no-files-found: error
          retention-days: 7

  ai:
    name: AI service tests and deterministic grounding evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        working-directory: ai-service
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit and middleware tests
        working-directory: ai-service
        run: python -m pytest -q
      - name: Retrieval grounding evaluation
        working-directory: ai-service
        run: python -m evaluation.evaluate_retrieval
      - name: Validate evaluation report JSON
        run: python -m json.tool ai-service/evaluation/latest-report.json >/dev/null

  container-integration:
    name: Build all images and run container smoke tests
    runs-on: ubuntu-latest
    needs: [contracts, frontend, backend, ai]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet
      - name: Validate fail-closed production profile configuration
        run: POSTGRES_PASSWORD=ci-only-config-validation docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Build complete application stack
        run: docker compose -f compose.yaml build --pull
      - name: Start integrated stack
        run: docker compose -f compose.yaml up -d
      - name: Smoke-test frontend, API and AI gateway
        run: ./scripts/smoke-release.sh
      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color || true
      - name: Stop services
        if: always()
        run: docker compose -f compose.yaml down --remove-orphans || true
