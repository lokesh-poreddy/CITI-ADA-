spring:
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:h2:file:./backend-data/udaan-setu;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${APP_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${APP_DATASOURCE_USERNAME:sa}
    password: ${APP_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: udaan-setu-platform-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
app:
  version: ${APP_VERSION:0.7.1}
  reviewer-token: ${APP_REVIEWER_TOKEN:}
  prototype-identities-enabled: ${APP_PROTOTYPE_IDENTITIES_ENABLED:true}
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false
info:
  app:
    name: UdaanSetu
    description: Hackathon prototype for rural learning-to-livelihood pathways
    release-stage: HACKATHON_PROTOTYPE

logging:
  pattern:
    level: "%5p [rid:%X{requestId:-}]"
